name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 . --ignore=E501,W292,E402,E302 || true

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=${PYTHONPATH}:${GITHUB_WORKSPACE}" >> $GITHUB_ENV

    - name: Run tests
      run: |
        pytest --maxfail=1 --disable-warnings -q


  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Example for frontend
      - name: Build and Push frontend service
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          REPO_URI=${{ secrets.FRONT_END_ECR }}
          docker build -t $REPO_URI:$IMAGE_TAG ./front_end
          docker push $REPO_URI:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and deploy front end service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          env:
            IMAGE_TAG: ${{ github.sha }}   # full SHA, or substring below
            REPO_URI: ${{ secrets.FRONT_END_ECR }}
          script: |
            # If you want only first 7 chars of SHA
            IMAGE_TAG=${IMAGE_TAG::7}

            docker pull $REPO_URI:$IMAGE_TAG
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 8501:8501 --restart unless-stopped $REPO_URI:$IMAGE_TAG