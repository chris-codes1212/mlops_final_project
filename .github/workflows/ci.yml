name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 . --ignore=E501,W292,E402,E302 || true

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=${PYTHONPATH}:${GITHUB_WORKSPACE}" >> $GITHUB_ENV

    - name: Run tests
      run: |
        pytest --maxfail=1 --disable-warnings -q


  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Example for frontend
      - name: Build and Push frontend service
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          REPO_URI=${{ secrets.FRONT_END_ECR }}
          docker build -t $REPO_URI:$IMAGE_TAG ./front_end
          docker push $REPO_URI:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and deploy front end service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          env: |
            IMAGE_TAG=${{ github.sha }}
            REPO_URI=${{ secrets.FRONT_END_ECR }}
          script: |
            # Shorten SHA to first 7 characters safely
            IMAGE_TAG=$(echo $IMAGE_TAG | cut -c1-7)

            NEW_CONTAINER_NAME=frontend_new
            OLD_CONTAINER_NAME=frontend
            PORT=8501

            echo "Pulling new image $REPO_URI:$IMAGE_TAG"
            docker pull $REPO_URI:$IMAGE_TAG

            echo "Starting new container $NEW_CONTAINER_NAME"
            docker run -d \
              --name $NEW_CONTAINER_NAME \
              -p $PORT:8501 \
              --restart unless-stopped \
              $REPO_URI:$IMAGE_TAG

            echo "Waiting for new container to be running..."
            until [ "$(docker inspect -f '{{.State.Running}}' $NEW_CONTAINER_NAME)" == "true" ]; do
              sleep 2
            done

            # Stop and remove old container if it exists
            if [ "$(docker ps -a -q -f name=$OLD_CONTAINER_NAME)" ]; then
              echo "Stopping old container $OLD_CONTAINER_NAME"
              docker stop $OLD_CONTAINER_NAME
              docker rm $OLD_CONTAINER_NAME
            else
              echo "No old container $OLD_CONTAINER_NAME found, skipping stop/remove"
            fi

            echo "Renaming new container to $OLD_CONTAINER_NAME"
            docker rename $NEW_CONTAINER_NAME $OLD_CONTAINER_NAME

            echo "Deployment complete!"



         



